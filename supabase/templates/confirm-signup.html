<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Jevolution account</title>
  </head>
  <body style="margin:0;padding:0;background:#0e1912;color:#edf1df;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">Confirm your email to open your Jevolution habitat.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0e1912;">
      <tr><td align="center" style="padding:40px 20px;">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="width:100%;max-width:560px;border:1px solid #43563b;background:#19251b;">
          <tr><td style="padding:28px 32px;border-bottom:1px solid #43563b;font-family:Courier New,monospace;font-size:22px;font-weight:bold;letter-spacing:1px;color:#d3e89c;">jevolution</td></tr>
          <tr><td style="padding:32px;">
            <h1 style="margin:0 0 20px;font-size:26px;line-height:1.25;color:#edf1df;">Confirm your email</h1>
            <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#c2ccbb;">One last step. Confirm this email address to finish creating your Jevolution account.</p>
            <table role="presentation" cellspacing="0" cellpadding="0"><tr><td bgcolor="#d3e89c" style="border:1px solid #d3e89c;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 24px;color:#182112;text-decoration:none;font-size:16px;font-weight:bold;">Confirm email</a></td></tr></table>
            <p style="margin:28px 0 0;font-size:14px;line-height:1.6;color:#a8b49d;">If you didn’t create this account, you can ignore this email.</p>
          </td></tr>
          <tr><td style="padding:20px 32px;border-top:1px solid #43563b;font-size:13px;line-height:1.5;color:#a8b49d;">Jevolution &middot; <a href="https://jevolution.world/" style="color:#d3e89c;text-decoration:none;">jevolution.world</a></td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
